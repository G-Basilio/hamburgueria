<div class="container mt-4">
  <h2 class="mb-4">Gerenciar Ingredientes</h2>

  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <form (ngSubmit)="salvar()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Descrição</label>
            <input type="text" class="form-control" name="descricao" [(ngModel)]="ingredienteAtual.descricao" required>
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label">Preço Unitário (R$)</label>
            <input type="number" step="0.01" class="form-control" name="precoUnitario" [(ngModel)]="ingredienteAtual.precoUnitario" required>
          </div>
          <div class="col-md-3 mb-3 d-flex align-items-end">
            <div class="form-check mb-2">
              <input type="checkbox" class="form-check-input" name="adicional" id="adicional" [(ngModel)]="ingredienteAtual.adicional">
              <label class="form-check-label" for="adicional">É Adicional?</label>
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="!ingredienteAtual.descricao || ingredienteAtual.precoUnitario < 0">Salvar</button>
        <button type="button" class="btn btn-secondary ms-2" (click)="ingredienteAtual = novoIngrediente()">Cancelar</button>
      </form>
    </div>
  </div>

  <div class="input-group mb-3 shadow-sm">
    <input type="text" class="form-control" placeholder="Pesquisar por descrição..." name="termoBusca" [(ngModel)]="termoBusca">
    <button class="btn btn-outline-primary" type="button" (click)="listar()">Pesquisar</button>
  </div>

  <table class="table table-striped table-hover shadow-sm align-middle">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Descrição</th>
      <th>Preço</th>
      <th>Adicional?</th>
      <th class="text-end">Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let i of ingredientes">
      <td>{{ i.id }}</td>
      <td>{{ i.descricao }}</td>
      <td>R$ {{ i.precoUnitario }}</td>
      <td>
          <span class="badge" [ngClass]="i.adicional ? 'text-bg-success' : 'text-bg-secondary'">
            {{ i.adicional ? 'Sim' : 'Não' }}
          </span>
      </td>
      <td class="text-end">
        <button class="btn btn-sm btn-warning" (click)="editar(i)">Editar</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
