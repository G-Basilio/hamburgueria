<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-secondary m-0"><i class="bi bi-egg-fried me-2"></i>Gerenciar Ingredientes</h3>
  </div>

  <div class="card mb-4">
    <div class="card-body p-4">
      <form (ngSubmit)="salvar()">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label text-muted fw-semibold">Descrição</label>
            <input type="text" class="form-control" name="descricao" [(ngModel)]="ingredienteAtual.descricao" placeholder="Ex: Bacon em Tiras" required>
          </div>

          <div class="col-md-3">
            <label class="form-label text-muted fw-semibold">Preço Unitário (R$)</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0">R$</span>
              <input type="number" step="0.01" class="form-control border-start-0" name="precoUnitario" [(ngModel)]="ingredienteAtual.precoUnitario" placeholder="0.00" required>
            </div>
          </div>

          <div class="col-md-3 d-flex align-items-end">
            <div class="form-check form-switch mb-2 fs-5">
              <input class="form-check-input" type="checkbox" role="switch" name="adicional" id="adicional" [(ngModel)]="ingredienteAtual.adicional">
              <label class="form-check-label ms-2 fs-6 mt-1 text-muted fw-semibold" for="adicional">É Adicional?</label>
            </div>
          </div>
        </div>

        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4" [disabled]="!ingredienteAtual.descricao || !ingredienteAtual.precoUnitario || ingredienteAtual.precoUnitario <= 0">
            <i class="bi bi-check2-circle"></i> Salvar
          </button>
          <button type="button" class="btn btn-light px-4 border" (click)="ingredienteAtual = novoIngrediente()">
            <i class="bi bi-x-circle"></i> Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-body p-3">
      <div class="input-group">
        <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control border-start-0 ps-0" placeholder="Pesquisar ingrediente por descrição..." name="termoBusca" [(ngModel)]="termoBusca" (ngModelChange)="filtrarLista()">
      </div>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
      <tr>
        <th class="ps-4">ID</th>
        <th>Descrição</th>
        <th>Preço</th>
        <th>Adicional?</th>
        <th class="text-end pe-4">Ações</th>
      </tr>
      </thead>
      <tbody>
      <<tr *ngFor="let i of ingredientesFiltrados">
        <td class="ps-4 text-muted fw-semibold">#{{ i.id }}</td>
        <td class="fw-medium">{{ i.descricao }}</td>
        <td class="text-success fw-semibold">R$ {{ i.precoUnitario | number:'1.2-2' }}</td>
        <td>
            <span class="badge rounded-pill" [ngClass]="i.adicional ? 'text-bg-warning text-dark' : 'text-bg-secondary'">
              <i class="bi" [ngClass]="i.adicional ? 'bi-star-fill' : 'bi-dash-circle'"></i>
              {{ i.adicional ? 'Sim' : 'Não' }}
            </span>
        </td>
        <td class="text-end pe-4">
          <button class="btn btn-sm btn-outline-primary" (click)="editar(i)">
            <i class="bi bi-pencil-square"></i> Editar
          </button>
        </td>
      </tr>
      <tr *ngIf="ingredientesFiltrados.length === 0">
        <td colspan="5" class="text-center py-4 text-muted">Nenhum ingrediente encontrado.</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
