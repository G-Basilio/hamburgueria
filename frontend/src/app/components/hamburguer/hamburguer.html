<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-secondary m-0"><i class="bi bi-shop me-2"></i>Gerenciar Hambúrgueres</h3>
  </div>

  <div class="card mb-4">
    <div class="card-body p-4">
      <form (ngSubmit)="salvar()">
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label text-muted fw-semibold">Descrição</label>
            <input type="text" class="form-control" name="descricao" [(ngModel)]="hamburguerAtual.descricao" placeholder="Ex: X-Bacon Duplo" required>
          </div>

          <div class="col-md-4">
            <label class="form-label text-muted fw-semibold">Valor (R$)</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0">R$</span>
              <input type="number" step="0.01" class="form-control border-start-0" name="valor" [(ngModel)]="hamburguerAtual.valor" placeholder="0.00" required>
            </div>
          </div>
        </div>

        <div class="mt-4 mb-2">
          <label class="form-label text-muted fw-semibold mb-3">Selecione os Ingredientes:</label>
          <div class="row g-3">
            <div class="col-md-3 col-sm-6" *ngFor="let i of ingredientesDisponiveis">
              <div class="form-check form-switch fs-6">
                <input class="form-check-input" type="checkbox" role="switch" [id]="'ing_'+i.id" [checked]="possuiIngrediente(i.id)" (change)="toggleIngrediente(i, $event)">
                <label class="form-check-label ms-2 text-muted" [for]="'ing_'+i.id">{{ i.descricao }}</label>
              </div>
            </div>
            <div *ngIf="ingredientesDisponiveis.length === 0" class="text-muted small">
              <i class="bi bi-info-circle me-1"></i> Nenhum ingrediente cadastrado ainda.
            </div>
          </div>
        </div>

        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4" [disabled]="!hamburguerAtual.descricao || !hamburguerAtual.valor || hamburguerAtual.valor <= 0">
            <i class="bi bi-check2-circle"></i> Salvar
          </button>
          <button type="button" class="btn btn-light px-4 border" (click)="hamburguerAtual = novoHamburguer()">
            <i class="bi bi-x-circle"></i> Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-body p-3">
      <div class="input-group">
        <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control border-start-0 ps-0" placeholder="Pesquisar hambúrguer por descrição..." name="termoBusca" [(ngModel)]="termoBusca" (ngModelChange)="filtrarLista()">
      </div>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
      <tr>
        <th class="ps-4">ID</th>
        <th>Descrição</th>
        <th>Ingredientes</th>
        <th>Valor</th>
        <th class="text-end pe-4">Ações</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let h of hamburgueresFiltrados">
        <td class="ps-4 text-muted fw-semibold">#{{ h.id }}</td>
        <td class="fw-medium">{{ h.descricao }}</td>
        <td>
            <span class="badge text-bg-light border me-1 text-muted fw-normal mb-1" *ngFor="let i of h.ingredientes">
              {{ i.descricao }}
            </span>
          <span *ngIf="h.ingredientes.length === 0" class="text-muted small">Nenhum</span>
        </td>
        <td class="text-success fw-semibold">R$ {{ h.valor | number:'1.2-2' }}</td>
        <td class="text-end pe-4">
          <button class="btn btn-sm btn-outline-primary" (click)="editar(h)">
            <i class="bi bi-pencil-square"></i> Editar
          </button>
        </td>
      </tr>
      <tr *ngIf="hamburgueresFiltrados.length === 0">
        <td colspan="5" class="text-center py-4 text-muted">Nenhum hambúrguer encontrado.</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
