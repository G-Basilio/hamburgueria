<div class="container mt-4">
  <h2 class="mb-4">Gerenciar Hambúrgueres</h2>

  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <form (ngSubmit)="salvar()">
        <div class="row">
          <div class="col-md-8 mb-3">
            <label class="form-label">Descrição</label>
            <input type="text" class="form-control" name="descricao" [(ngModel)]="hamburguerAtual.descricao" required>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Valor (R$)</label>
            <input type="number" step="0.01" class="form-control" name="valor" [(ngModel)]="hamburguerAtual.valor" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Selecione os Ingredientes:</label>
          <div class="row">
            <div class="col-md-3" *ngFor="let i of ingredientesDisponiveis">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" [checked]="possuiIngrediente(i.id)" (change)="toggleIngrediente(i, $event)">
                <label class="form-check-label">{{ i.descricao }}</label>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="!hamburguerAtual.descricao || hamburguerAtual.valor < 0">Salvar</button>
        <button type="button" class="btn btn-secondary ms-2" (click)="hamburguerAtual = novoHamburguer()">Cancelar</button>
      </form>
    </div>
  </div>

  <table class="table table-striped table-hover shadow-sm align-middle">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Descrição</th>
      <th>Ingredientes</th>
      <th>Valor</th>
      <th class="text-end">Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let h of hamburgueres">
      <td>{{ h.id }}</td>
      <td>{{ h.descricao }}</td>
      <td>
        <span class="badge text-bg-info me-1" *ngFor="let i of h.ingredientes">{{ i.descricao }}</span>
      </td>
      <td>R$ {{ h.valor }}</td>
      <td class="text-end">
        <button class="btn btn-sm btn-warning" (click)="editar(h)">Editar</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
